name: Unify CI

# ROADMAP.md Phase 0 ("Wire the harness into CI"). Scoped to only the Unify
# module (and this workflow file) so unrelated changes elsewhere in the repo
# don't trigger it.
#
# A Forgejo Actions twin of this file lives in
# .forgejo/workflows/unify-ci.yml -- KEEP THE TWO IN SYNC. (Forgejo ignores
# .github/workflows once a .forgejo directory exists, and GitHub never reads
# .forgejo, so each platform runs exactly one copy. The twin's only intended
# differences are the upload-artifact action -- Forgejo needs the patched
# fork from code.forgejo.org -- its paths filter naming itself, and the
# absence of the windows-msvc job below, which has no Windows runner to
# run on there.)
on:
  push:
    paths:
      - "unify/**"
      - "lens/**"
      - ".github/workflows/unify-ci.yml"
  pull_request:
    paths:
      - "unify/**"
      - "lens/**"
      - ".github/workflows/unify-ci.yml"
  # Manual trigger; with update_golden=true the build-and-test job also
  # regenerates all golden files and uploads them as the
  # unify-generated-goldens artifact (review + commit them by hand -- the
  # dev machine has no local toolchain to run UNIFY_UPDATE_GOLDEN itself).
  workflow_dispatch:
    inputs:
      update_golden:
        description: "Regenerate golden files and upload as artifact"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cmake and g++ are preinstalled on GitHub's ubuntu-latest image (the
      # explicit install is a fast no-op there); listing them anyway, and not
      # assuming sudo exists, keeps this step identical to the Forgejo twin,
      # where jobs typically run as root in a minimal container.
      - name: Install build dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential cmake libboost-all-dev

      - name: Configure
        run: |
          cmake -S unify -B build/unify \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cmake --build build/unify --parallel

      - name: Run golden-output tests (ctest)
        run: |
          ctest --output-on-failure
        working-directory: build/unify

      # Only on manual dispatch with update_golden=true (see `on:` above).
      # `always()` so it still runs when the ctest step above failed --
      # regenerating goldens is exactly what you want on an outdated-golden
      # failure. github.event.inputs is used (not the inputs context) for
      # Forgejo compatibility; its values are strings.
      - name: Regenerate golden files (manual dispatch only)
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.update_golden == 'true'
        run: |
          UNIFY_UPDATE_GOLDEN=1 ctest --output-on-failure
        working-directory: build/unify
      - name: Upload regenerated golden files
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.update_golden == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unify-generated-goldens
          path: unify/test/golden/
          if-no-files-found: warn

      # Runs each sample program directly and uploads its combined
      # stdout+stderr as a build artifact -- useful raw material when
      # updating golden files or debugging a red run (the golden tests
      # themselves compare stdout only; see test/run-golden-test.sh).
      - name: Run sample programs (for bootstrapping golden files)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p sample-outputs
          for program in test-engine test2 pathfinder mediaplayer; do
            echo "=== $program.ufy ===" | tee "sample-outputs/${program}.out"
            timeout 120 ./build/unify/unify-run "unify/${program}.ufy" \
              >> "sample-outputs/${program}.out" 2>&1 || true
          done
          echo "=== mapsyntax.ufy ===" | tee "sample-outputs/mapsyntax.out"
          timeout 120 ./build/unify/unify-run "unify/test/mapsyntax.ufy" \
            >> "sample-outputs/mapsyntax.out" 2>&1 || true
          # mediaplayer.ufy is currently empty (ROADMAP.md) -- skipped.

      - name: Upload sample outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unify-sample-outputs
          path: sample-outputs/
          if-no-files-found: warn

  # ROADMAP.md Phase 1 ("Run the test suite under ASan/LeakSanitizer"). The
  # engine is KNOWN to leak (raw `new` throughout -- see ROADMAP.md Phase 1
  # "Ownership model"), so leak detection cannot gate CI yet; this job gates
  # on memory *errors* (use-after-free, overflow, UB) via ASan+UBSan
  # immediately, and only reports leaks informationally via an uploaded
  # artifact, until the ownership-model work lands and leaks can be zeroed.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential cmake libboost-all-dev

      - name: Configure (ASan+UBSan)
        run: |
          cmake -S unify -B build/unify-asan \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DUNIFY_SANITIZE=address,undefined

      - name: Build (ASan+UBSan)
        run: |
          cmake --build build/unify-asan --parallel

      # Gates the job: memory errors (use-after-free, overflow, UB) must not
      # happen. Leak detection is off here (ASAN_OPTIONS=detect_leaks=0) --
      # the engine is known to leak (ROADMAP.md Phase 1) and that is tracked
      # separately by the informational step below, not by this gate.
      - name: Memory errors (must pass)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --output-on-failure
        working-directory: build/unify-asan

      # GATES the job since 2026-08-20: every sample and conformance program
      # runs leak-free (ROADMAP.md Phase 1 ownership model complete), so any
      # LeakSanitizer finding is a regression and fails CI.
      - name: Leak check (must stay at zero)
        if: always()
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: report_objects=0
        run: |
          mkdir -p leak-report
          for program in test-engine test2 pathfinder mediaplayer; do
            echo "=== $program.ufy ===" | tee "leak-report/${program}.txt"
            timeout 120 ./build/unify-asan/unify-run "unify/${program}.ufy" \
              >> "leak-report/${program}.txt" 2>&1 || true
          done
          echo "=== mapsyntax.ufy ===" | tee "leak-report/mapsyntax.txt"
          timeout 120 ./build/unify-asan/unify-run "unify/test/mapsyntax.ufy" \
            >> "leak-report/mapsyntax.txt" 2>&1 || true
          # Query-exercising conformance programs (ROADMAP.md Phase 1: the
          # SolveJob arena and query Goal ownership only free memory for
          # jobs that actually run a "goal ?" query).
          for program in clause-order strings-numbers unification-basics arithmetic comparison cut if-statement findall-arrays loops assert-retract strings imports recursion; do
            echo "=== ${program}.ufy ===" | tee "leak-report/${program}.txt"
            timeout 120 ./build/unify-asan/unify-run "unify/test/conformance/${program}.ufy" \
              >> "leak-report/${program}.txt" 2>&1 || true
          done

          echo "--- Leak summary ---"
          FAIL=0
          for f in leak-report/*.txt; do
            echo "$f:"
            if grep -E 'SUMMARY: AddressSanitizer|leaked in' "$f"; then
              FAIL=1
            else
              echo "  clean"
            fi
          done
          exit $FAIL

      - name: Upload leak report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unify-leak-report
          path: leak-report/
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # lens, on Linux. Builds the engine as a subproject (lens/CMakeLists.txt
  # does the add_subdirectory), so this job runs BOTH suites: every
  # unify-* test and every lens-* one.
  #
  # LENS_BUILD_TERM=ON on purpose. The terminal backend is one file
  # (lens/src/term/ftxui-terminal.cpp) and it is the only one that includes
  # FTXUI or touches a real tty, so it is exactly the file that a
  # model-only build would never compile.
  # ---------------------------------------------------------------------
  lens-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential cmake git libboost-all-dev

      - name: Configure
        run: |
          cmake -S lens -B build/lens \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLENS_BUILD_TERM=ON

      - name: Build
        run: |
          cmake --build build/lens --parallel

      - name: Test
        run: |
          ctest --output-on-failure
        working-directory: build/lens

  # ---------------------------------------------------------------------
  # Windows / MSVC.
  #
  # Why this job exists, in one sentence: five separate build failures in
  # this repository were code that compiles on Linux and macOS BY ACCIDENT
  # -- a POSIX header nobody needed, a Boost header pulled in transitively,
  # a UTF-8 character constant read in the system codepage -- and every one
  # of them was found by a person on a Windows machine rather than by CI.
  # This job is what converts that class of bug into a red build.
  #
  # It builds lens, which means it also builds the engine, with the real
  # MSVC toolchain, Boost from vcpkg, and LENS_BUILD_TERM=ON so the
  # terminal backend's Windows path is compiled too.
  #
  # There is deliberately no Forgejo twin of this job: the Forgejo instance
  # has Linux runners only. See the header of .forgejo/workflows/unify-ci.yml.
  # ---------------------------------------------------------------------
  windows-msvc:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, so the steps read the same as the Linux jobs' and the
        # bash-based test harnesses have the shell they need. `ctest` finds
        # the same bash via find_program(), so the golden-screen and
        # layering checks run here rather than silently disappearing.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vcpkg builds Boost from source on a cache miss, which is slow; the
      # binary cache turns every later run into an unpack. Keyed on the
      # workflow file because that is where the port list lives -- change
      # the ports and you want a new cache, not a stale one.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/unify-ci.yml') }}
          restore-keys: |
            vcpkg-x64-windows-

      # The runner image ships vcpkg and points VCPKG_INSTALLATION_ROOT at
      # it. cygpath -m turns C:\vcpkg into C:/vcpkg, which Git Bash will run
      # as a command AND CMake will accept as a path -- the POSIX form
      # (/c/vcpkg) does only the first of those.
      #
      # Boost from vcpkg is modular: these are the three ports the engine
      # actually needs. boost-format is not among them because the xdebug
      # backend that uses it is off on Windows (unify/CMakeLists.txt).
      - name: Install Boost (vcpkg)
        run: |
          VCPKG="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")"
          echo "VCPKG=$VCPKG" >> "$GITHUB_ENV"
          "$VCPKG/vcpkg.exe" install --triplet x64-windows \
            boost-spirit boost-thread boost-filesystem

      # The default generator on this image is a multi-config Visual Studio
      # one, so the configuration is chosen at build time (--config), not
      # here; CMAKE_BUILD_TYPE would be ignored.
      - name: Configure
        run: |
          cmake -S lens -B build/lens \
                -A x64 \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-windows \
                -DLENS_BUILD_TERM=ON

      - name: Build
        run: |
          cmake --build build/lens --config RelWithDebInfo --parallel

      # Gates the job: the C++ suites, the session boundary, and every lens
      # test including the golden screens and the layering checks.
      - name: Test
        run: |
          ctest -C RelWithDebInfo --output-on-failure \
                -R "^(lens-|unify-session-|unify-engine-)"
        working-directory: build/lens

      # Informational, for now. The engine's golden files pin unify-run's
      # stdout, and no one has yet audited them for the things a different C
      # runtime formats differently. The harness normalizes line endings
      # (test/run-golden-test.sh), so this may well be green -- when it has
      # been green for a while, fold it into the gating step above and
      # delete this one.
      - name: Engine golden files (informational)
        if: always()
        continue-on-error: true
        run: |
          ctest -C RelWithDebInfo --output-on-failure -R "^unify-golden-"
        working-directory: build/lens
